# docker/nginx/default.conf 
server { 
    listen 80; 
    server_name localhost; 
    root /var/www/html/public; 
    index index.php index.html; 
 
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Mesmas regras dos .htaccess (usados na Locaweb/Apache):
    # materiais e anexos do forum so saem pelas rotas com login.
    location ^~ /traducaidiomas/materiais/ {
        deny all;
    }
    location ^~ /traducaidiomas/forum/ {
        deny all;
    }

    # Nenhum script roda dentro das pastas de upload.
    location ~* ^/traducaidiomas/(alunos|professor|servicos|img|banners)/.*\.(php[0-9]?|phtml|phar)$ {
        deny all;
    }
 
    location ~ \.php$ { 
        include fastcgi_params; 
        fastcgi_pass php:9000; 
        fastcgi_index index.php; 
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; 
        fastcgi_param PATH_INFO $fastcgi_path_info; 
    } 
 
    location ~ /\.ht { 
        deny all; 
    } 
 
    client_max_body_size 100M; 
}