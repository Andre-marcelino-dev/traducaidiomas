name: Deploy para VPS

# Só roda manualmente (aba Actions > Run workflow).
# O site no ar fica em /public_html/traduca e é publicado pelo FileZilla;
# este deploy aponta para a pasta antiga public_html/traducaidiomas e
# falha na conexão SSH desde 07/08/2026.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/storage/d/d7/b9/adminfo1/public_html/traducaidiomas
            git pull origin main
            composer install --no-dev --optimize-autoloader
